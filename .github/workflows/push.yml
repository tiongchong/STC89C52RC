name: Build and Flash STC89C52

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Enables manual triggering from GitHub UI

jobs:
  deploy:
    runs-on: [self-hosted, Linux, ARM64]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Hardware Verification and Deployment Pipeline
      run: |
        echo "Running pre-push hardware verification..."

        # 1. Activate virtual environment
        VENV_PATH="$HOME/Projects/STC/.venv/bin/activate"
        if [ -f "$VENV_PATH" ]; then
            source "$VENV_PATH"
        else
            echo "ERROR: Virtual environment not found at $VENV_PATH"
            exit 1
        fi

        # 2. Compile source code
        echo "Compiling source code..."
        make
        if [ $? -ne 0 ]; then
            echo "ERROR: Compilation failed. Pipeline aborted."
            exit 1
        fi

        # 3. Flash to STC89C52RC
        echo "Flashing to board (/dev/ttyUSB0)..."
        make flash
        if [ $? -ne 0 ]; then
            echo "ERROR: Flashing failed. Pipeline aborted."
            exit 1
        fi

        # 4. Verify serial CLI prompt
        echo "Verifying CLI prompt..."
        python3 -c '
        import serial
        import time

        port = "/dev/ttyUSB0"
        baud = 9600
        timeout = 2

        try:
            ser = serial.Serial(port, baud, timeout=timeout)
            time.sleep(1) # Allow microcontroller to stabilize after flash reset
            
            # Send ENTER key (CR/LF)
            ser.write(b"\r\n")
            time.sleep(0.5)
            
            # Read response
            response = ser.read_all().decode("utf-8", errors="ignore")
            ser.close()
            
            print(f"--- Serial Output Received ---\n{response}\n------------------------------")
            
            if "STC89C52RC>" in response:
                print("SUCCESS: CLI prompt detected.")
                exit(0)
            else:
                print("ERROR: Expected prompt \"STC89C52RC>\" not found.")
                exit(1)
                
        except Exception as e:
            print(f"ERROR: Failed to communicate with serial port: {e}")
            exit(1)
        '

        if [ $? -ne 0 ]; then
            echo "ERROR: Hardware verification failed. Pipeline aborted."
            exit 1
        fi

        echo "All checks passed successfully!"
